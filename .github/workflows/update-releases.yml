name: Update New Releases

on:
  schedule:
    # Every 6 hours
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_PUBLIC_PULSE_DATA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/data
  PULSE_GITHUB_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  update-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout hosting branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape Melon new releases
        run: npm run update:releases

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/new-releases.json
          if git diff --staged --quiet; then
            echo "No release catalog changes"
            exit 0
          fi
          git commit -m "chore(releases): sync Melon new music catalog"
          git push
