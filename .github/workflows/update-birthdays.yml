name: Update Birthdays

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Single source of truth for catalog + image hosting URLs.
  # Example shape: https://raw.githubusercontent.com/<owner>/<repo>/<branch>/data
  EXPO_PUBLIC_PULSE_DATA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/data

jobs:
  update-birthdays:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync birthdays + Pulse-hosted images
        run: npm run update:birthdays

      - name: Verify local assets before publish
        run: npm run verify:pulse-data:local

      - name: Commit and push catalog + images
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/birthdays.json data/images/

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No birthday catalog or image changes detected."
            exit 0
          fi

          git commit -m "chore(birthdays): refresh catalog and Pulse-hosted images"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify published URLs (fail closed)
        run: |
          set -euo pipefail
          echo "Verifying ${EXPO_PUBLIC_PULSE_DATA_BASE_URL}"
          # Allow raw.githubusercontent.com a brief propagation window after push.
          sleep 5
          npm run verify:pulse-data:remote
