name: Update Events

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_PUBLIC_PULSE_DATA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/data
  PULSE_GITHUB_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  update-events:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout hosting branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync events from public RSS feeds and publish if changed
        run: |
          set -euo pipefail
          echo "Hosting base: ${EXPO_PUBLIC_PULSE_DATA_BASE_URL}"
          # update:events =
          #   1) download configured free public RSS feeds
          #   2) keep event-related items; extract structured fields
          #   3) normalize / dedupe / drop expired
          #   4) write data/events.json + pipeline log + technical report
          #   5) commit/push only when the catalog fingerprint changed
          npm run update:events
